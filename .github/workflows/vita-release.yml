name: Vita build and draft release

on:
  push:
    branches: [vita-port]
  pull_request:
    branches: [vita-port]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vita-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Vita VPK
    if: github.ref == 'refs/heads/vita-port' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build python3 curl bzip2 xz-utils
          echo "VITASDK=$RUNNER_TEMP/vitasdk" >> "$GITHUB_ENV"

      - name: Install pinned Vita toolchain and libraries
        run: bash tools/setup_vita_ci.sh

      - name: Run host regression tests
        run: |
          cc -std=c11 -Iplatforms/vita/game \
            platforms/vita/tests/debug_menu_activation_test.c \
            -o "$RUNNER_TEMP/debug-menu-activation-test"
          "$RUNNER_TEMP/debug-menu-activation-test"
          cc -std=c11 -Wall -Wextra -Werror -DTARGET_PC \
            -Isrc -Isrc/sdk_include \
            platforms/vita/tests/allstar_return_selection_test.c \
            -o "$RUNNER_TEMP/allstar-return-selection-test"
          "$RUNNER_TEMP/allstar-return-selection-test"
          cc -std=c11 -Wall -Wextra -Werror -Iplatforms/vita/game \
            platforms/vita/tests/opening_timeline_test.c \
            -o "$RUNNER_TEMP/opening-timeline-test"
          "$RUNNER_TEMP/opening-timeline-test"
          cc -std=c11 -Wall -Wextra -Werror \
            -Iplatforms/vita/game -Isrc \
            platforms/vita/tests/trophy_lottery_save_test.c \
            -o "$RUNNER_TEMP/trophy-lottery-save-test"
          "$RUNNER_TEMP/trophy-lottery-save-test"
          cc -std=c11 -Wall -Wextra -Werror \
            -Iplatforms/vita -Isrc \
            platforms/vita/tests/poke_floats_texture_test.c \
            platforms/vita/texture_decoder.c \
            -o "$RUNNER_TEMP/poke-floats-texture-test"
          "$RUNNER_TEMP/poke-floats-texture-test"
          cc -std=c11 -Wall -Wextra -Werror -Iplatforms/vita/game \
            platforms/vita/tests/copy_texture_lifetime_test.c \
            -o "$RUNNER_TEMP/copy-texture-lifetime-test"
          "$RUNNER_TEMP/copy-texture-lifetime-test"
          cc -std=c11 -Wall -Wextra -Werror -Iplatforms/vita/game \
            platforms/vita/tests/results_backdrop_test.c \
            -o "$RUNNER_TEMP/results-backdrop-test"
          "$RUNNER_TEMP/results-backdrop-test"

      - name: Build full game
        shell: pwsh
        run: |
          $env:PATH = "$env:VITASDK/bin:$env:PATH"
          ./platforms/vita/build-full.ps1 -Configuration Release -Jobs 2

      - name: Verify release has no debug symbols or logger
        run: |
          export PATH="$VITASDK/bin:$PATH"
          arm-vita-eabi-readelf --sections build-vita/full/melee-full.elf > build-vita/sections.txt
          arm-vita-eabi-nm --defined-only build-vita/full/melee-full.elf > build-vita/symbols.txt
          if grep -Eq '\.debug_|\.zdebug_' build-vita/sections.txt; then
            echo "::error::Release ELF still contains debug sections"
            exit 1
          fi
          if grep -Eq ' (uvdb_|melee_vita_(log_|debugger_))' build-vita/symbols.txt; then
            echo "::error::Release ELF still contains logging/debugger symbols"
            exit 1
          fi
          if ! grep -Eq ' mnVitaDebug_FeedActivation$' build-vita/symbols.txt; then
            echo "::error::Release ELF is missing the hidden debug-menu gate"
            exit 1
          fi

      - name: Package release assets
        run: |
          mkdir -p dist
          cp build-vita/full/SmashMeleevita.vpk dist/SmashMeleevita.vpk
          cp README.md dist/README-Vita.md
          cp platforms/vita/DEBUG-TOOLS.md dist/DEBUG-TOOLS.md
          cp platforms/vita/version.json dist/version.json
          cp LICENSE.md COPYING dist/
          printf '%s\n' "$GITHUB_SHA" > dist/COMMIT.txt
          python3 - <<'PY'
          import json
          import struct
          import zipfile
          with zipfile.ZipFile("dist/SmashMeleevita.vpk") as vpk:
              assert vpk.testzip() is None, "Corrupt VPK"
              assert {"eboot.bin", "sce_sys/param.sfo"} <= set(vpk.namelist())
              assert not any(name.lower().endswith((".iso", ".gcm", ".rvz", ".dol", ".suprx", ".skprx")) for name in vpk.namelist())
              sfo = vpk.read("sce_sys/param.sfo")
              magic, revision, keys, values, count = struct.unpack_from("<5I", sfo)
              assert magic == 0x46535000, "Invalid SFO"
              fields = {}
              for index in range(count):
                  key, fmt, size, capacity, offset = struct.unpack_from("<HHIII", sfo, 20 + index * 16)
                  name = sfo[keys + key:].split(b"\0", 1)[0].decode("ascii")
                  fields[name] = sfo[values + offset:values + offset + size].rstrip(b"\0")
              assert fields["TITLE"] == b"Smash Melee Vita", "Incorrect game title"
              assert fields["TITLE_ID"] == b"MLVITA002", "Title ID must remain compatible"
              with open("dist/version.json") as version_file:
                  assert fields["APP_VER"].decode("ascii") == json.load(version_file)["app"]
          PY
          (cd dist && sha256sum SmashMeleevita.vpk README-Vita.md DEBUG-TOOLS.md version.json LICENSE.md COPYING COMMIT.txt > SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: vita-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  draft-release:
    name: Create unpublished release draft
    needs: build
    if: >-
      github.repository_id == '1372143812' &&
      github.ref == 'refs/heads/vita-port' &&
      github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vita-${{ github.sha }}
          path: dist

      - name: Create draft for manual approval
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(python3 -c 'import json; print(json.load(open("dist/version.json"))["release"])')
          tag="vita-v${version}-build.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          cat > release-notes.md <<EOF
          Experimental native PS Vita port. This is an unpublished draft for maintainer review.

          Release version: ${version}
          Commit: ${GITHUB_SHA}
          Build: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          Install SmashMeleevita.vpk with VitaShell. Read README-Vita.md for the required
          homebrew environment, shader compiler module, disc image
          path, and controls. Game data and proprietary modules are not included.

          Expect stuttering while shaders compile at runtime. Cached shaders reduce
          repeat compilation as you play, but performance and compatibility remain
          experimental. Back up saves before updating.

          ## Hidden Debug Tools

          This build includes Melee's original developer menus for testing matches,
          items, cameras, collision displays, sound, and other internal features.
          Nothing appears during normal play. To reveal **DEBUG TOOLS**, open Options
          and enter **Up, Up, Down, Down, Left, Right, Left, Right, Select** on the
          D-pad. The unlock lasts only until the application closes.

          These menus were designed for developers, so some combinations may behave
          strangely. Dangerous save, memory-card, and unsupported hardware actions
          are disabled. Read the attached **DEBUG-TOOLS.md** before using them; it
          explains the Vita controls, safe functions, camera, item spawner, and how
          to leave a debug match.

          This is an optimized Release build with logging and debugger support
          disabled. Review and publish this draft manually when ready; this
          workflow never publishes releases automatically.
          EOF
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "Smash Melee Vita ${version} (experimental build ${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT})" \
            --notes-file release-notes.md \
            --draft --prerelease \
            dist/SmashMeleevita.vpk dist/README-Vita.md dist/DEBUG-TOOLS.md dist/version.json \
            dist/LICENSE.md dist/COPYING dist/COMMIT.txt dist/SHA256SUMS.txt
