name: Vita build and draft release

on:
  push:
    branches: [vita-port]
  pull_request:
    branches: [vita-port]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vita-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Vita VPK
    if: github.ref == 'refs/heads/vita-port' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build python3 python3-cryptography \
            curl bzip2 xz-utils
          echo "VITASDK=$RUNNER_TEMP/vitasdk" >> "$GITHUB_ENV"

      - name: Install pinned Vita toolchain and libraries
        run: bash tools/setup_vita_ci.sh

      - name: Run host regression tests
        run: |
          cc -std=c11 -Iplatforms/vita/game \
            platforms/vita/tests/debug_menu_activation_test.c \
            -o "$RUNNER_TEMP/debug-menu-activation-test"
          "$RUNNER_TEMP/debug-menu-activation-test"
          cc -std=c11 -Wall -Wextra -Werror -DTARGET_PC \
            -Isrc -Isrc/sdk_include \
            platforms/vita/tests/allstar_return_selection_test.c \
            -o "$RUNNER_TEMP/allstar-return-selection-test"
          "$RUNNER_TEMP/allstar-return-selection-test"
          cc -std=c11 -Wall -Wextra -Werror -Isrc \
            platforms/vita/tests/giga_bowser_unlock_test.c \
            -o "$RUNNER_TEMP/giga-bowser-unlock-test"
          "$RUNNER_TEMP/giga-bowser-unlock-test"
          cc -std=c11 -Wall -Wextra -Werror -Iplatforms/vita/game \
            platforms/vita/tests/opening_timeline_test.c \
            -o "$RUNNER_TEMP/opening-timeline-test"
          "$RUNNER_TEMP/opening-timeline-test"
          cc -std=c11 -Wall -Wextra -Werror \
            -Iplatforms/vita/game -Isrc \
            platforms/vita/tests/trophy_lottery_save_test.c \
            -o "$RUNNER_TEMP/trophy-lottery-save-test"
          "$RUNNER_TEMP/trophy-lottery-save-test"
          cc -std=c11 -Wall -Wextra -Werror -Iplatforms/vita/game \
            platforms/vita/tests/save_progress_compat_test.c \
            -o "$RUNNER_TEMP/save-progress-compat-test"
          "$RUNNER_TEMP/save-progress-compat-test"
          cc -std=c11 -Wall -Wextra -Werror \
            -Iplatforms/vita -Isrc \
            platforms/vita/tests/poke_floats_texture_test.c \
            platforms/vita/texture_decoder.c \
            -o "$RUNNER_TEMP/poke-floats-texture-test"
          "$RUNNER_TEMP/poke-floats-texture-test"
          cc -std=c11 -Wall -Wextra -Werror -Iplatforms/vita/game \
            platforms/vita/tests/copy_texture_lifetime_test.c \
            -o "$RUNNER_TEMP/copy-texture-lifetime-test"
          "$RUNNER_TEMP/copy-texture-lifetime-test"
          cc -std=c11 -Wall -Wextra -Werror -Iplatforms/vita/game \
            platforms/vita/tests/results_backdrop_test.c \
            -o "$RUNNER_TEMP/results-backdrop-test"
          "$RUNNER_TEMP/results-backdrop-test"
          cc -std=c11 -Wall -Wextra -Werror \
            -Iplatforms/vita/game -Isrc -Isrc/sdk_include \
            platforms/vita/tests/fragment_alpha_key_test.c \
            -o "$RUNNER_TEMP/fragment-alpha-key-test"
          "$RUNNER_TEMP/fragment-alpha-key-test"
          cc -std=c11 -Wall -Wextra -Werror \
            -Iplatforms/vita/game \
            platforms/vita/tests/gx_bump_test.c \
            platforms/vita/game/gx_bump.c -lm \
            -o "$RUNNER_TEMP/gx-bump-test"
          "$RUNNER_TEMP/gx-bump-test"
          cc -std=c11 -Wall -Wextra -Werror -Iplatforms/vita/game \
            platforms/vita/tests/gxr_shader_cache_test.c \
            platforms/vita/game/gxr_shader_cache.c \
            -o "$RUNNER_TEMP/gxr-shader-cache-test"
          "$RUNNER_TEMP/gxr-shader-cache-test"
          cc -std=c11 -Wall -Wextra -Werror -Iplatforms/vita/game \
            platforms/vita/tests/gxm_resolution_test.c \
            -o "$RUNNER_TEMP/gxm-resolution-test"
          "$RUNNER_TEMP/gxm-resolution-test"
          cc -std=c11 -Wall -Wextra -Werror -Iplatforms/vita/game \
            platforms/vita/tests/pad_mapping_test.c \
            -o "$RUNNER_TEMP/pad-mapping-test"
          "$RUNNER_TEMP/pad-mapping-test"
          cc -std=c11 -Wall -Wextra -Werror -Iplatforms/vita/game \
            platforms/vita/tests/point_sprite_test.c \
            -o "$RUNNER_TEMP/point-sprite-test"
          "$RUNNER_TEMP/point-sprite-test"
          cc -std=c11 -Wall -Wextra -Werror -Iplatforms/vita/game \
            platforms/vita/tests/display_list_memo_test.c \
            -o "$RUNNER_TEMP/display-list-memo-test"
          "$RUNNER_TEMP/display-list-memo-test"
          cc -std=c11 -Wall -Wextra -Werror -Iplatforms/vita/game \
            '-DMELEE_VITA_RELEASE_VERSION="0.8.2"' \
            '-DMELEE_VITA_BUILD_NUMBER="37.1"' \
            platforms/vita/tests/title_build_label_test.c \
            -o "$RUNNER_TEMP/title-build-label-test"
          "$RUNNER_TEMP/title-build-label-test"

      - name: Run updater regression tests
        shell: pwsh
        run: |
          ./platforms/vita/test-updater.ps1 `
            -HostCompiler /usr/bin/g++ `
            -VitaSdk $env:VITASDK

      - name: Build full game
        shell: pwsh
        run: |
          $env:PATH = "$env:VITASDK/bin:$env:PATH"
          $publicKey = (
            Get-Content platforms/vita/updater/public-key.hex -Raw
          ).Trim()
          ./platforms/vita/build-full.ps1 -Configuration Release -Jobs 2 `
            -InternalResolutionScale 60 -GameplayInternalResolutionScale 75 `
            -EnableScaledShadowFrames -EnableScaledGxCopyFrames `
            -EnableRuntimeResolutionMenu `
            -EnableUpdater -UpdaterPublicKeyHex $publicKey `
            -VitaBuildNumber "${{ github.run_number }}.${{ github.run_attempt }}"

      - name: Verify release has no debug symbols or logger
        run: |
          export PATH="$VITASDK/bin:$PATH"
          arm-vita-eabi-readelf --sections build-vita/full/melee-full.elf > build-vita/sections.txt
          arm-vita-eabi-nm --defined-only build-vita/full/melee-full.elf > build-vita/symbols.txt
          if grep -Eq '\.debug_|\.zdebug_' build-vita/sections.txt; then
            echo "::error::Release ELF still contains debug sections"
            exit 1
          fi
          if grep -Eq ' (uvdb_|melee_vita_(log_|debugger_))' build-vita/symbols.txt; then
            echo "::error::Release ELF still contains logging/debugger symbols"
            exit 1
          fi
          if ! grep -Eq ' mnVitaDebug_FeedActivation$' build-vita/symbols.txt; then
            echo "::error::Release ELF is missing the hidden debug-menu gate"
            exit 1
          fi
          arm-vita-eabi-readelf --sections \
            build-vita/full/updater-helper/updater.elf > build-vita/helper-sections.txt
          arm-vita-eabi-readelf --all \
            build-vita/full/updater-helper/updater.elf > build-vita/helper-imports.txt
          if grep -Eq '\.debug_|\.zdebug_' build-vita/helper-sections.txt; then
            echo "::error::Updater helper ELF still contains debug sections"
            exit 1
          fi
          if grep -Eq 'Sce(Gxm|Pgf|Display|CommonDialog|Ctrl)|vita2d' \
              build-vita/helper-imports.txt; then
            echo "::error::Updater helper is not strictly headless"
            exit 1
          fi

      - name: Package release assets
        run: |
          mkdir -p dist
          version=$(python3 -c 'import json; print(json.load(open("platforms/vita/version.json"))["release"])')
          cp build-vita/full/SmashMeleevita.vpk "dist/SmashMeleevita-${version}.vpk"
          cp platforms/vita/DEBUG-TOOLS.md dist/DEBUG-TOOLS.md
          cp platforms/vita/version.json dist/version.json
          python3 - <<'PY'
          import json
          import struct
          import zipfile
          from pathlib import Path

          version = json.loads(Path("dist/version.json").read_text())["release"]
          with zipfile.ZipFile(f"dist/SmashMeleevita-{version}.vpk") as vpk:
              assert vpk.testzip() is None, "Corrupt VPK"
              assert {
                  "eboot.bin",
                  "sce_sys/param.sfo",
                  "sce_sys/homebrew_update.ini",
              } <= set(vpk.namelist())
              assert not any(name.lower().endswith((".iso", ".gcm", ".rvz", ".dol", ".suprx", ".skprx")) for name in vpk.namelist())
              assert vpk.read("sce_sys/homebrew_update.ini").decode("ascii") == (
                  "title_id=MLVITA002\n"
                  "name=Smash Melee Vita\n"
                  "update_url=https://github.com/zm2283145/melee-Vita/"
                  "releases/latest/download/MLVITA002-ver.xml\n"
              )
              sfo = vpk.read("sce_sys/param.sfo")
              magic, revision, keys, values, count = struct.unpack_from("<5I", sfo)
              assert magic == 0x46535000, "Invalid SFO"
              fields = {}
              for index in range(count):
                  key, fmt, size, capacity, offset = struct.unpack_from("<HHIII", sfo, 20 + index * 16)
                  name = sfo[keys + key:].split(b"\0", 1)[0].decode("ascii")
                  fields[name] = sfo[values + offset:values + offset + size].rstrip(b"\0")
              assert fields["TITLE"] == b"Smash Melee Vita", "Incorrect game title"
              assert fields["TITLE_ID"] == b"MLVITA002", "Title ID must remain compatible"
              assert fields["CONTENT_ID"] == b"EP9000-MLVITA002_00-0000000000000000"
              with open("dist/version.json") as version_file:
                  assert fields["APP_VER"].decode("ascii") == json.load(version_file)["app"]
              assert {
                  "updater/eboot.bin",
                  "updater/sce_sys/param.sfo",
                  "updater/sce_sys/package/head.bin",
              } <= set(vpk.namelist()), "Updater helper package is incomplete"
          PY
          python3 platforms/vita/updater/generate-homebrew-update-metadata.py \
            --version-file dist/version.json \
            --release-notes .github/RELEASE_NOTES.md \
            --vpk "dist/SmashMeleevita-${version}.vpk" \
            --output-directory dist

      - name: Sign updater manifest
        if: github.event_name != 'pull_request'
        env:
          VITA_UPDATER_PRIVATE_KEY_PEM: ${{ secrets.VITA_UPDATER_PRIVATE_KEY_PEM }}
        run: |
          if [[ -z "$VITA_UPDATER_PRIVATE_KEY_PEM" ]]; then
            echo "::error::VITA_UPDATER_PRIVATE_KEY_PEM is not configured"
            exit 1
          fi
          key="$RUNNER_TEMP/vita-updater-private.pem"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$VITA_UPDATER_PRIVATE_KEY_PEM" > "$key"
          chmod 600 "$key"
          version=$(python3 -c 'import json; print(json.load(open("dist/version.json"))["release"])')
          python3 platforms/vita/updater/sign-manifest.py \
            --version "$version" \
            --asset "dist/SmashMeleevita-${version}.vpk" \
            --private-key "$key" \
            --output dist/melee-update-manifest.txt
          python3 - "$key" <<'PY'
          import json
          import pathlib
          import sys

          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PublicKey

          manifest = pathlib.Path("dist/melee-update-manifest.txt").read_bytes()
          lines = manifest.splitlines(keepends=True)
          assert len(lines) == 6 and all(line.endswith(b"\n") for line in lines)
          public_key = bytes.fromhex(
              pathlib.Path("platforms/vita/updater/public-key.hex").read_text().strip()
          )
          signature = bytes.fromhex(lines[5].decode("ascii").strip().split("=", 1)[1])
          Ed25519PublicKey.from_public_bytes(public_key).verify(
              signature, b"".join(lines[:5])
          )
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: vita-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  draft-release:
    name: Create unpublished release draft
    needs: build
    if: >-
      github.repository_id == '1372143812' &&
      github.ref == 'refs/heads/vita-port' &&
      github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: vita-${{ github.sha }}
          path: dist

      - name: Create draft for manual approval
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(python3 -c 'import json; print(json.load(open("dist/version.json"))["release"])')
          tag="v${version}"
          if existing=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null); then
            if [[ "$existing" != "true" ]]; then
              echo "::error::Published release $tag already exists; bump platforms/vita/version.json"
              exit 1
            fi
            gh release delete "$tag" --cleanup-tag --yes
          fi
          python3 - "$version" <<'PY'
          import pathlib
          import sys

          version = sys.argv[1]
          notes = pathlib.Path(".github/RELEASE_NOTES.md").read_text()
          heading = f"## Changes in Vita v{version}"
          start = notes.find(heading)
          if start < 0:
              raise SystemExit(f"Missing release notes section: {heading}")
          end = notes.find("\n## ", start + len(heading))
          current = notes[start:] if end < 0 else notes[start:end]
          pathlib.Path("release-notes.md").write_text(
              current.rstrip() + "\n", newline="\n"
          )
          PY
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "Smash Melee Vita ${version}" \
            --notes-file release-notes.md \
            --draft \
            "dist/SmashMeleevita-${version}.vpk" dist/melee-update-manifest.txt \
            dist/MLVITA002-ver.xml dist/MLVITA002-changeinfo.xml \
            dist/DEBUG-TOOLS.md dist/version.json
          mkdir release-verify
          gh release download "$tag" --dir release-verify \
            --pattern "SmashMeleevita-${version}.vpk" \
            --pattern melee-update-manifest.txt \
            --pattern MLVITA002-ver.xml \
            --pattern MLVITA002-changeinfo.xml
          cmp "dist/SmashMeleevita-${version}.vpk" \
            "release-verify/SmashMeleevita-${version}.vpk"
          cmp dist/melee-update-manifest.txt \
            release-verify/melee-update-manifest.txt
          cmp dist/MLVITA002-ver.xml release-verify/MLVITA002-ver.xml
          cmp dist/MLVITA002-changeinfo.xml \
            release-verify/MLVITA002-changeinfo.xml
