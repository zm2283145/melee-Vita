name: PS5 build

# vita-port pushes build the PS5 title in the release workflow
# (vita-release.yml); this one covers other branches and manual runs.
on:
  push:
    branches: [ps5-port]
    paths:
      - 'platforms/ps5/**'
      - 'platforms/vita/**'
      - 'src/**'
      - 'extern/**'
      - 'tools/setup_ps5_ci.sh'
      - '.github/workflows/ps5-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ps5-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build PS5 homebrew title
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc clang-18 lld-18 llvm-18 libclang-rt-18-dev \
            cmake ninja-build bison flex glslang-tools git \
            python3 python3-pip curl unzip zip xz-utils ccache
          pip3 install --break-system-packages meson mako pyyaml packaging

      - name: Cache PS5 toolchain
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ps5
          key: ps5-toolchain-bp4f531c4-gl1.0.1-fast-v2

      - name: Install pinned PS5 toolchain
        run: bash tools/setup_ps5_ci.sh "$RUNNER_TEMP/ps5"

      - name: Build
        run: |
          BUILD_JOBS=$(nproc) bash platforms/ps5/build.sh

      - name: Check the package
        run: |
          app=build-ps5/app/dist/PPSA99701
          test -s "$app/eboot.bin"
          for f in param.json icon0.png pic0.dds pic1.dds; do test -s "$app/sce_sys/$f"; done
          # The disc image is never part of a build.
          ! find build-ps5/app/dist -iname '*.iso' | grep -q .

      - uses: actions/upload-artifact@v4
        with:
          name: melee-ps5-${{ github.sha }}
          path: build-ps5/app/dist/PPSA99701.zip
          if-no-files-found: error
          retention-days: 30
